### Qwen2.5-0.5B-Instruct LoRA on CPU.
### Launch (no NVIDIA GPU):
###   CUDA_VISIBLE_DEVICES="" HIP_VISIBLE_DEVICES="" \
###     llamafactory-cli train tools/cpu-trainer/llamafactory/qwen25_0.5b_cpu_lora.yaml
### Install a CPU PyTorch wheel first. See the repository README.
### LLaMA-Factory has no single stable device=cpu switch; hiding the GPU and
### turning bf16/fp16 off is what actually keeps the job on CPU.

### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### dataset
dataset: trainloop_corrections
dataset_dir: tools/cpu-trainer/llamafactory/data
template: qwen
cutoff_len: 256
max_samples: 32
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: saves/qwen2.5-0.5b-llamafactory-cpu-lora
logging_steps: 1
save_steps: 20
plot_loss: false
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 1.0
max_steps: 20
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: false
fp16: false
flash_attn: disabled
tf32: false
optim: adamw_torch
gradient_checkpointing: false
ddp_timeout: 180000000
seed: 42
